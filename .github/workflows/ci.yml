name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache only once a lockfile is committed (setup-node errors on a missing one).
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Guard - src/lib must be tracked
        # A root .gitignore rule `lib/` once silently excluded frontend/src/lib (mock-data, utils).
        run: |
          test -f src/lib/mock-data.ts -a -f src/lib/utils.ts || {
            echo "::error::frontend/src/lib/ is missing from the repository (check .gitignore, then git add -f frontend/src/lib)"
            exit 1
          }

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (tests, migrations, seed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triageflow
          POSTGRES_PASSWORD: triageflow
          POSTGRES_DB: triageflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triageflow -d triageflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # The suite runs on in-memory SQLite (see backend/tests/conftest.py).
      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

      # Tests never touch Postgres, so prove the migrations and seed work on the real engine.
      - name: Alembic migrations + seed on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://triageflow:triageflow@localhost:5432/triageflow
          JWT_SECRET: ci-only-secret
        run: |
          alembic upgrade head
          python -m app.seed
          python -m app.seed   # second run must be a no-op ("already seeded")

  ml-service:
    name: ML service (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, ml-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: triageflow-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-smoke:
    name: Full-stack smoke test (docker compose)
    needs: [frontend, backend, ml-service, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file with the documented .env
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Backend is ready and seeded demo login works
        run: |
          curl -fsS http://localhost:8000/ready | jq -e '.status == "ready"'
          TOKEN="$(curl -fsS -X POST http://localhost:8000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@triageflow.dev","password":"Password123!"}' | jq -r .access_token)"
          curl -fsS http://localhost:8000/auth/me -H "Authorization: Bearer $TOKEN" | jq -e '.role == "admin"'

      - name: ML service serves predictions from the bootstrap model
        run: |
          curl -fsS http://localhost:8001/health | jq -e '.status == "ok" and .active_model_version != null'
          curl -fsS -X POST http://localhost:8001/predict \
            -H 'Content-Type: application/json' \
            -d '{"subject":"Refund not received","body":"I cancelled two weeks ago and still have no refund."}' \
            | jq -e '.category and .routing_team and .model_version'

      - name: Frontend serves the SPA and proxies the API
        run: |
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/ | grep -q 'id="root"'
          curl -fsS http://localhost:3000/api/health | jq -e '.status == "ok"'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
