services:
  db:
    image: postgres:16-alpine
    container_name: triageflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: triageflow
      POSTGRES_PASSWORD: triageflow
      POSTGRES_DB: triageflow
    ports:
      - "5432:5432"
    volumes:
      - triageflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triageflow -d triageflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: triageflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: development
      DEBUG: "true"
      PROJECT_NAME: TriageFlow
      DATABASE_URL: postgresql+psycopg2://triageflow:triageflow@db:5432/triageflow
      JWT_SECRET: change-this-to-a-long-random-string-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      SEED_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  triageflow_pg_data:
