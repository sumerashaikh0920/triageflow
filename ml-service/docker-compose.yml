# STANDALONE ML service + Postgres only (host ports 5432/8000).
# For the full stack use the root docker-compose.yml:  docker compose up --build
# Do not run this alongside the root stack: the ports collide.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: triageflow
      POSTGRES_PASSWORD: triageflow
      POSTGRES_DB: triageflow
    ports:
      - "5432:5432"
    volumes:
      - triageflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triageflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://triageflow:triageflow@db:5432/triageflow
      ML_SERVICE_ENV: docker
      LOG_LEVEL: INFO
      RETRAIN_MIN_APPROVED_CORRECTIONS: "50"
      RETRAIN_WEEKLY_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist trained model artifacts and feedback dataset snapshots
      # across container restarts/rebuilds.
      - ./models:/srv/app/models
      - ./data/feedback_exports:/srv/app/data/feedback_exports

  # The backend is wired to this service in the root docker-compose.yml.

volumes:
  triageflow_pg_data:
